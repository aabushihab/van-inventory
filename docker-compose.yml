# تشغيل النظام كاملاً (قاعدة بيانات + تطبيق):  docker compose up -d --build
# الإعدادات والأسرار في ملف .env (انسخه من .env.example)
services:
  db:
    image: postgres:16-alpine
    container_name: van-distribution-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-van_distribution}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: Asia/Amman
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-van_distribution}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: van-distribution-app:latest
    container_name: van-distribution-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-van_distribution}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8090}
      COMPANY_NAME: ${COMPANY_NAME:-شركة التوزيع}
      COMPANY_NAME_EN: ${COMPANY_NAME_EN:-Distribution Company}
      COMPANY_CURRENCY: ${COMPANY_CURRENCY:-JOD}
    ports:
      - "${APP_PORT:-8090}:8090"

volumes:
  pgdata:
