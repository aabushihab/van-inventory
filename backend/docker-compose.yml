services:
  postgres:
    image: postgres:16-alpine
    container_name: van-distribution-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: van_distribution
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - van_distribution_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d van_distribution"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  van_distribution_pgdata:
