server:
  port: ${SERVER_PORT:8090}
  # ملف تثبيت التطبيق على الموبايل/التابلت (PWA)
  mime-mappings:
    webmanifest: application/manifest+json

spring:
  application:
    name: van-erp-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:van_distribution}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_THIS_SECRET_TO_A_LONG_RANDOM_STRING_IN_PRODUCTION_ENV_1234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}          # 24h
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}   # 7d
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5180,http://localhost:5173,http://localhost:3000}
  low-stock:
    check-cron: ${LOW_STOCK_CRON:0 0 * * * *}    # every hour
    notify-email-enabled: ${LOW_STOCK_EMAIL_ENABLED:false}
  audit-log:
    retention-days: ${AUDIT_LOG_RETENTION_DAYS:30}   # يُحتفظ بالسجلات شهراً ثم تُحذف تلقائياً
    purge-cron: ${AUDIT_LOG_PURGE_CRON:0 0 3 * * *}  # كل يوم الساعة 3 صباحاً
  company:
    name: ${COMPANY_NAME:شركة التوزيع}
    name-en: ${COMPANY_NAME_EN:Distribution Company}
    tax-number: ${COMPANY_TAX_NUMBER:}
    phone: ${COMPANY_PHONE:}
    address: ${COMPANY_ADDRESS:}
    currency: ${COMPANY_CURRENCY:JOD}

management:
  health:
    mail:
      enabled: false   # SMTP اختياري - لا يجعل فحص صحة النظام DOWN عند عدم ضبطه

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.vanerp: INFO
    org.springframework.security: WARN
